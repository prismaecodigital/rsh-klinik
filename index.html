<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 1.5rem;
        }

        .container {
            text-align: center;
            max-width: 32rem;
            width: 100%;
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .progress-track {
            width: 100%;
            height: 0.5rem;
            background: #1e293b;
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 40%;
            border-radius: 9999px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            animation: build 2.5s ease-in-out infinite;
        }

        @keyframes build {
            0%   { width: 15%; }
            50%  { width: 75%; }
            100% { width: 15%; }
        }

        .note {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>We're Building Something</h1>
        <p>This website is currently under construction. Please check back soon — we're working hard to bring you something great.</p>
        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>
        <div class="note">Coming soon</div>
    </div>
</body>
</html>
